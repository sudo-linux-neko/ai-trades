[package]
name = "ai-trades"
version = "0.2.0"
edition = "2021"
description = "EvoTrader — evolutionary human-like trading engine: fear of death, love of being copied, 20yr backtest, pure Rust"
license = "MIT"
repository = "https://github.com/anomalyco/ai-trades"
keywords = ["trading", "evolution", "genetic", "backtest", "tui"]
categories = ["finance", "command-line-utilities"]

[[bin]]
name = "ai-trades"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
rand = "0.8"
rand_chacha = "0.3"
rayon = "1.10"
indicatif = "0.17"
crossterm = "0.28"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
